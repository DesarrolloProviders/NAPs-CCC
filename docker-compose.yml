# Infraestructura de desarrollo de naps-ccc-nextjs.
#   app-db : PostgreSQL 16 propio del proyecto (usuarios, reservas, auditoría). Host: localhost:5440
#   El PostGIS de NAPs (solo lectura) es el de ../legacy-php (contenedor nap-postgis), expuesto en localhost:5441.
#   app    : imagen de producción (profile "prod"); se une a la red de legacy-php para llegar a 192.168.100.212.
services:
  app-db:
    image: postgres:16-alpine
    container_name: naps-ccc-db
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: naps
      POSTGRES_PASSWORD: naps
      POSTGRES_DB: naps_ccc
      TZ: America/Argentina/Tucuman
    volumes:
      - app-db-data:/var/lib/postgresql/data
      - ./docker/app-db/init-test-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naps -d naps_ccc"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    profiles: ["prod"]
    build: .
    container_name: naps-ccc-app
    ports:
      - "3110:3000"
    env_file: .env.docker
    depends_on:
      app-db:
        condition: service_healthy
    networks:
      - default
      - napnet
    restart: unless-stopped

networks:
  napnet:
    external: true
    name: legacy-php_napnet

volumes:
  app-db-data:
